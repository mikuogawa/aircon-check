<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エアコン工事費かんたん診断</title>
<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:#f3f6fb;
  color:#111;
}
.app{
  max-width:900px;
  margin:auto;
  padding:18px;
}
.header{
  background:#003b8f;
  color:white;
  text-align:center;
  font-size:34px;
  font-weight:900;
  padding:22px;
  border-radius:16px;
}
.card{
  background:white;
  border-radius:18px;
  padding:28px;
  margin-top:22px;
  box-shadow:0 4px 16px #0001;
  text-align:center;
}
h2{
  font-size:32px;
}
.btn{
  display:block;
  width:100%;
  max-width:560px;
  margin:16px auto;
  padding:22px;
  border:3px solid #0046ad;
  background:white;
  color:#003b8f;
  border-radius:14px;
  font-size:26px;
  font-weight:800;
}
.btn:hover{
  background:#eaf2ff;
}
.back{
  margin-top:20px;
  background:#666;
  color:white;
  border:none;
}
.price{
  font-size:48px;
  font-weight:900;
  color:#d60000;
}
.small{
  font-size:20px;
  color:#555;
}
.list{
  text-align:left;
  max-width:600px;
  margin:20px auto;
  font-size:22px;
  line-height:1.8;
}
</style>
</head>

<body>
<div class="app">
  <div class="header">エアコン工事費かんたん診断</div>
  <div class="card" id="screen"></div>
</div>

<script>
let data = {};
let historyStack = [];

/* ===== 金額設定ここから ===== */
const PRICE = {
  baseNew: 16500,
  baseReplace: 22000,
  removeOld: 6600,

  tatamiUp14: 0,
  tatamiUp18: 5500,
  tatamiOver18: 11000,

  standard: 0,
  wall: 8800,
  roof: 8800,
  rack2: 11000,
  secondToFirst: 16500,
  thirdToFirst: 27500,
  publicCeiling: 22000,

  normalPipe: 0,
  hiddenPipe: 11000,
  unknownPipe: 0,

  noElevator: 5500,

  subsidy: -40000
};
/* ===== 金額設定ここまで ===== */

const screenEl = document.getElementById("screen");

function show(html){
  screenEl.innerHTML = html;
}

function go(step){
  historyStack.push(step);
  window[step]();
}

function back(){
  historyStack.pop();
  const prev = historyStack.pop();
  if(prev){
    go(prev);
  }else{
    start();
  }
}

function btn(text, next, key, value){
  return `<button class="btn" onclick="data['${key}']='${value}'; go('${next}')">${text}</button>`;
}

function start(){
  historyStack = [];
  data = {};
  go("qType");
}

function qType(){
  show(`
    <h2>エアコンはどちらですか？</h2>
    ${btn("新規取り付け", "qTokyo", "type", "new")}
    ${btn("買い替え", "qTokyo", "type", "replace")}
  `);
}

function qTokyo(){
  show(`
    <h2>お住まいは東京都ですか？</h2>
    ${btn("東京都", "qSupport", "tokyo", "yes")}
    ${btn("東京都ではない", "skipYearCheck", "tokyo", "no")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function qSupport(){
  show(`
    <h2>対象に当てはまりますか？</h2>
    <p class="small">65歳以上、または障害者手帳をお持ちの方</p>
    ${btn("当てはまる", "skipYearCheck", "support", "yes")}
    ${btn("当てはまらない", "qYears", "support", "no")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function skipYearCheck(){
  data.years = "skip";
  go("qTatami");
}

function qYears(){
  if(data.type === "new"){
    data.years = "skip";
    go("qTatami");
    return;
  }

  show(`
    <h2>今のエアコンは何年使っていますか？</h2>
    ${btn("10年以上", "qTatami", "years", "over10")}
    ${btn("10年未満", "qTatami", "years", "under10")}
    ${btn("わからない", "qTatami", "years", "unknown")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function qTatami(){
  show(`
    <h2>何畳用のエアコンですか？</h2>
    ${btn("6〜10畳用", "qInstall", "tatami", "10")}
    ${btn("12〜14畳用", "qInstall", "tatami", "14")}
    ${btn("18畳用", "qInstall", "tatami", "18")}
    ${btn("20畳以上", "qInstall", "tatami", "over18")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function qInstall(){
  show(`
    <h2>室外機の設置方法は？</h2>
    ${btn("標準設置", "qPipe", "install", "standard")}
    ${btn("壁面取り付け", "qPipe", "install", "wall")}
    ${btn("屋根置き", "qPipe", "install", "roof")}
    ${btn("二段置き", "qPipe", "install", "rack2")}
    ${btn("2階→1階", "qPipe", "install", "secondToFirst")}
    ${btn("3階→1階", "qPipe", "install", "thirdToFirst")}
    ${btn("公団吊り", "qPipe", "install", "publicCeiling")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function qPipe(){
  show(`
    <h2>配管の種類は？</h2>
    ${btn("通常配管", "qElevator", "pipe", "normal")}
    ${btn("隠ぺい配管", "qElevator", "pipe", "hidden")}
    ${btn("わからない", "qElevator", "pipe", "unknown")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function qElevator(){
  show(`
    <h2>エレベーターはありますか？</h2>
    ${btn("ある", "result", "elevator", "yes")}
    ${btn("ない", "result", "elevator", "no")}
    <button class="btn back" onclick="back()">戻る</button>
  `);
}

function result(){
  let total = 0;
  let detail = [];

  if(data.type === "new"){
    total += PRICE.baseNew;
    detail.push(["新規取り付け基本工事", PRICE.baseNew]);
  }else{
    total += PRICE.baseReplace;
    total += PRICE.removeOld;
    detail.push(["買い替え基本工事", PRICE.baseReplace]);
    detail.push(["既存エアコン取り外し", PRICE.removeOld]);
  }

  if(data.tatami === "18"){
    total += PRICE.tatamiUp18;
    detail.push(["18畳用追加", PRICE.tatamiUp18]);
  }

  if(data.tatami === "over18"){
    total += PRICE.tatamiOver18;
    detail.push(["20畳以上追加", PRICE.tatamiOver18]);
  }

  const installMap = {
    standard:["標準設置", PRICE.standard],
    wall:["壁面取り付け", PRICE.wall],
    roof:["屋根置き", PRICE.roof],
    rack2:["二段置き", PRICE.rack2],
    secondToFirst:["2階→1階", PRICE.secondToFirst],
    thirdToFirst:["3階→1階", PRICE.thirdToFirst],
    publicCeiling:["公団吊り", PRICE.publicCeiling]
  };

  let install = installMap[data.install];
  total += install[1];
  detail.push(install);

  if(data.pipe === "hidden"){
    total += PRICE.hiddenPipe;
    detail.push(["隠ぺい配管追加", PRICE.hiddenPipe]);
  }

  if(data.pipe === "unknown"){
    detail.push(["配管確認が必要", 0]);
  }

  if(data.elevator === "no"){
    total += PRICE.noElevator;
    detail.push(["エレベーターなし追加", PRICE.noElevator]);
  }

  let subsidyText = "";
  if(data.tokyo === "yes" && data.support === "yes"){
    total += PRICE.subsidy;
    if(total < 0) total = 0;
    subsidyText = `<p class="small">東京都の対象者として補助金目安を反映しています</p>`;
    detail.push(["補助金目安", PRICE.subsidy]);
  }

  let detailHtml = detail.map(item=>{
    const yen = item[1] === 0 ? "要確認" : item[1].toLocaleString() + "円";
    return `<li>${item[0]}：${yen}</li>`;
  }).join("");

  show(`
    <h2>診断結果</h2>
    <div class="price">${total.toLocaleString()}円</div>
    <p class="small">概算金額です。現地状況により変わる場合があります。</p>
    ${subsidyText}
    <ul class="list">${detailHtml}</ul>
    <button class="btn" onclick="start()">最初からやり直す</button>
  `);
}

start();
</script>
</body>
</html>
