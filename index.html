<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>エアコン工事費かんたん診断</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f6fb;color:#111}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:18px}
.header{background:#003b8f;color:white;text-align:center;font-size:38px;font-weight:800;padding:22px;border-radius:14px}
.card{background:white;border-radius:18px;padding:28px;margin-top:22px;box-shadow:0 4px 16px #0001;text-align:center}
.big{font-size:48px;font-weight:900;color:#003b8f}
.sub{font-size:24px;font-weight:700}
.btn{display:block;width:100%;max-width:520px;margin:18px auto;padding:22px;border:3px solid #0046ad;background:white;color:#003b8f;border-radius:16px;font-size:28px;font-weight:800}
.btn.primary{background:#0046ad;color:white}
.btn.small{font-size:20px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.option{border:3px solid #cfd8e8;border-radius:16px;padding:22px;font-size:26px;font-weight:800;background:white}
.option:active,.selected{border-color:#0046ad;background:#eaf2ff}
.notice{background:#fff8dc;border-radius:14px;padding:18px;margin-top:20px;text-align:left;font-size:20px;line-height:1.8}
.progress{height:10px;background:#d8deea;border-radius:10px;margin-top:16px;overflow:hidden}
.bar{height:100%;background:#0068ff;width:0%}
.image{width:100%;border-radius:14px;margin:15px 0;border:1px solid #ddd}
.resultPrice{font-size:72px;font-weight:900;color:#003b8f;margin:15px}
.detail{font-size:18px;text-align:left;display:inline-block;line-height:1.8}
.hidden{display:none}
  .tapImage{position:relative;width:100%}
.tapImage img{width:100%;display:block}
.hot{position:absolute;background:transparent;border:0}
.h1{left:2%;top:8%;width:23%;height:40%}
.h2{left:27%;top:8%;width:23%;height:40%}
.h3{left:52%;top:8%;width:23%;height:40%}
.h4{left:77%;top:8%;width:21%;height:40%}
.h5{left:2%;top:50%;width:31%;height:38%}
.h6{left:35%;top:50%;width:31%;height:38%}
.h7{left:68%;top:50%;width:30%;height:38%}

 .p1{left:2%;top:15%;width:31%;height:70%}
.p2{left:34%;top:15%;width:31%;height:70%}
.p3{left:67%;top:15%;width:31%;height:70%} 
</style>
</head>
<body>
<div class="app">
  <div class="header">エアコン工事費 かんたん診断</div>
  <div id="screen"></div>
</div>

<script>
const imgInstall="images/0AB48FD8-F66B-4575-B338-9394A00EAE6C.png";
const imgPiping="images/D79A56E4-7DC8-452D-B6C5-E52DCB0C0CDC.png";

const state={};
let step=0;
let timer;

const base={
  small:20350,
  medium:24750,
  large:28050
};

const installNew={
  standard:{small:0,medium:0,large:0},
  wall:{small:16500,medium:18700,large:18700},
  koudan:{small:16500,medium:18700,large:18700},
  roof:{small:15400,medium:17600,large:17600},
  two:{small:19800,medium:20900,large:20900},
  second:{small:19800,medium:19800,large:19800},
  third:{small:36300,medium:36300,large:36300}
};

const installReplace={
  standard:{small:0,medium:0,large:0},
  wall:{small:8250,medium:10450,large:10450},
  koudan:{small:8250,medium:10450,large:10450},
  roof:{small:7700,medium:9900,large:9900},
  twoUpper:{small:2750,medium:3300,large:3300},
  twoLower:{small:7150,medium:8250,large:8250},
  second:{small:19800,medium:19800,large:19800},
  third:{small:36300,medium:36300,large:36300}
};

const removal={
  standard:6600,
  wall:9900,
  koudan:9900,
  roof:9900,
  two:6600,
  second:9900,
  third:14300
};

function yen(n){return "¥"+n.toLocaleString()+"〜"}
function label(v){
  return {
  small:"6〜12畳",
  medium:"14〜18畳",
  large:"20畳以上",

  senior:"65歳以上",
  disabled:"障害者手帳あり",

  new:"新規取付",
  replace:"買い替え",

  house:"戸建て",
  apartment:"マンション/アパート",
    standard:"標準設置",wall:"壁掛け",koudan:"公団吊り",roof:"屋根置き",two:"二段置き",
    second:"室内機2階→室外機1階",third:"室内機3階→室外機1階",
    normal:"標準配管",hidden:"隠蔽配管",unknown:"わからない",
    upper:"上段",lower:"下段",
    indoor:"内階段",outdoor:"外階段",none:"なし",
    yes:"はい",no:"いいえ"
  }[v]||v;
}

function resetTimer(){
  clearTimeout(timer);
  timer=setTimeout(()=>{step=0;for(const k in state)delete state[k];render();},60000);
}
document.addEventListener("click",resetTimer);

function go(key,val){
  state[key]=val;
  nextStep();
}

function nextStep(){
  step++;
  if(shouldSkip()) nextStep();
  else render();
}

function back(){
  if(step>0){step--; render();}
}

function shouldSkip(){
  if(step===3 && state.tokyo!=="yes") return true;
  if(step===4 && (state.type==="new" || state.zero==="senior" || state.zero==="disabled")) return true;
  if(step===7 && state.building!=="apartment") return true;
  if(step===8 && !(state.building==="apartment" && state.floor==="upper")) return true;
  if(step===12 && !(state.install==="two" && state.type==="replace")) return true;
  if(step===14 && state.type!=="replace") return true;
  return false;
}

function screen(title,html){
  const percent=Math.min(100,Math.max(0,(step/14)*100));
  document.getElementById("screen").innerHTML=`
  <div class="card">
    ${step>0?`<button class="btn small" onclick="back()">← 戻る</button>`:""}
    <div class="progress"><div class="bar" style="width:${percent}%"></div></div>
    <h1>${title}</h1>
    ${html}
  </div>`;
}

function render(){
  resetTimer();
  if(step===0){
    document.getElementById("screen").innerHTML=`
    <div class="card">
      <div class="big">エアコン工事費<br>かんたん診断</div>
      <p class="sub">約1分で概算工事費がわかります</p>
      <button class="btn primary" onclick="step=1;render()">診断をはじめる！</button>
      <div class="notice">
        ⚠️ 表示金額は概算工事費です。<br>
        ⚠️ 設置状況により追加工事費が発生する場合があります。<br>
        👨‍🔧 詳しくは店舗スタッフまでお気軽にご相談ください。
      </div>
    </div>`;
    return;
  }

  if(step===1) screen("新規取付ですか？買い替えですか？",`
    <button class="btn" onclick="go('type','new')">新規取付</button>
    <button class="btn" onclick="go('type','replace')">買い替え</button>`);

  if(step===2) screen("お住まいは東京都ですか？",`
    <button class="btn" onclick="go('tokyo','yes')">はい</button>
    <button class="btn" onclick="go('tokyo','no')">いいえ</button>`);

  if(step===3) screen("あなたは以下のいずれかに該当しますか？",`
    <button class="btn" onclick="go('zero','senior')">65歳以上</button>
    <button class="btn" onclick="go('zero','disabled')">障害者手帳を持っている</button>
    <button class="btn" onclick="go('zero','none')">該当しない</button>
    <button class="btn" onclick="go('zero','unknown')">わからない</button>`);

  if(step===4 && (state.zero==="senior" || state.zero==="disabled")){
  step=5;
  render();
  return;
}

if(step===4) screen("現在お使いのエアコンは？",
    <button class="btn" onclick="go('oldAge','15over')">15年以上使用している</button>
    <button class="btn" onclick="go('oldAge','under15')">15年未満</button>
    <button class="btn" onclick="go('oldAge','unknown')">わからない</button>`);

  if(step===5) screen("購入したいエアコンは何畳用ですか？",`
  <button class="btn" onclick="go('size','small')">6畳</button>
<button class="btn" onclick="go('size','small')">8畳</button>
<button class="btn" onclick="go('size','small')">10畳</button>
<button class="btn" onclick="go('size','small')">12畳</button>
<button class="btn" onclick="go('size','medium')">14畳</button>
<button class="btn" onclick="go('size','medium')">18畳</button>
<button class="btn" onclick="go('size','large')">20畳以上</button>`);

  if(step===6) screen("お住まいの種類を選んでください",`
    <div class="grid">
      <button class="option" onclick="go('building','house')">戸建て</button>
      <button class="option" onclick="go('building','apartment')">マンション/アパート</button>
    </div>`);

  if(step===7) screen("お住まいの階数は？",`
    <button class="btn" onclick="go('floor','first')">1階</button>
    <button class="btn" onclick="go('floor','upper')">2階以上</button>`);

  if(step===8) screen("エレベーターはありますか？",`
    <button class="btn" onclick="go('elevator','yes')">あり</button>
    <button class="btn" onclick="go('elevator','no')">なし</button>`);

  if(step===9) screen("室外機を階段で運ぶ必要がありますか？",`
    <button class="btn" onclick="go('stairs','none')">なし</button>
    <button class="btn" onclick="go('stairs','indoor')">内階段</button>
    <button class="btn" onclick="go('stairs','outdoor')">外階段</button>
    <button class="btn" onclick="go('stairs','unknown')">わからない</button>`);

  if(step===10) screen("設置方法を選んでください",
`<div class="tapImage">
  <img src="${imgInstall}" onerror="this.style.display='none'">
  <button class="hot h1" onclick="go('install','standard')"></button>
  <button class="hot h2" onclick="go('install','wall')"></button>
  <button class="hot h3" onclick="go('install','koudan')"></button>
  <button class="hot h4" onclick="go('install','roof')"></button>
  <button class="hot h5" onclick="go('install','two')"></button>
  <button class="hot h6" onclick="go('install','second')"></button>
  <button class="hot h7" onclick="go('install','third')"></button>
</div>`);
  
  if(step===11) screen("配管の種類を選んでください",
`<div class="tapImage">
<img src="${imgPiping}" onerror="this.style.display='none'">
<button class="hot p1" onclick="go('piping','normal')"></button>
<button class="hot p2" onclick="go('piping','hidden')"></button>
<button class="hot p3" onclick="go('piping','unknown')"></button>
</div>`);

  if(step===12) screen("二段置きのどちらですか？",`
    <button class="btn" onclick="go('twoPos','upper')">上段</button>
    <button class="btn" onclick="go('twoPos','lower')">下段</button>`);

  if(step===13){
  state.oldInstall = state.install;
  step=15;
  render();
}

  if(step>=14) result();
}

function calc(){
  const s=state.size;
  let total=base[s]||0;
  if(state.type==="new"){
    total+=installNew[state.install]?.[s]||0;
  }else{
    if(state.install==="two"){
      total+=installReplace[state.twoPos==="lower"?"twoLower":"twoUpper"]?.[s]||0;
    }else{
      total+=installReplace[state.install]?.[s]||0;
    }
  }
  if(state.piping==="hidden") total+=8800;
  if(state.stairs==="indoor") total+=(s==="small"?2200:3300);
  if(state.stairs==="outdoor") total+=2200;
  return total;
}

function zeroText(){
  if(state.tokyo!=="yes") return "";

  if(state.zero==="senior" || state.zero==="disabled"){
    return "🟢 対象機種が一律80000円引きになる場合があります。詳しくはスタッフまでご相談ください。";
  }

  if(state.type==="replace"){
    return "🟢 東京都の補助制度の対象となる可能性があります。";
  }

  return "⚪ 東京都の補助制度についてはスタッフへご相談ください。";
}

function result(){
  const total=calc();
const details=[
  label(state.type),
  label(state.size),
  label(state.building),
  state.building==="apartment" ? "階数："+(state.floor==="first"?"1階":"2階以上") : "",
  state.elevator ? "エレベーター："+label(state.elevator) : "",
  state.stairs ? "階段搬入："+label(state.stairs) : "",
  "設置方法："+label(state.install),
  state.install==="two"&&state.twoPos ? "二段置き："+label(state.twoPos) : "",
  "配管："+label(state.piping),
  state.type==="replace" ? "既存設置："+label(state.oldInstall) : "",
  state.oldAge ? "使用年数："+(state.oldAge==="15over"?"15年以上":state.oldAge==="under15"?"15年未満":"わからない") : "",
].filter(Boolean);

  document.getElementById("screen").innerHTML=`
  <div class="card">
    <h1>診断結果</h1>
    <div class="sub">概算工事費</div>
    <div class="resultPrice">${yen(total)}</div>
    <p class="sub">この画面をスタッフへお見せください</p>

    <div class="detail">
      <strong>診断内容</strong><br>
      ${details.map(x=>"・"+x).join("<br>")}
      <br><br>${zeroText()}
    </div>

    <div class="notice">
      ⚠️ 表示金額は概算工事費です。<br>
      ⚠️ 設置状況により追加工事費が発生する場合があります。<br>
     ${state.type==="replace" ? "⚠️ 家電リサイクル料金4,070円が別途必要です。<br>" : ""} 
      ${state.piping==="unknown"?"⚠️ 配管種類が不明のため、追加料金が発生する場合があります。<br>":""}
      ${state.stairs==="unknown"?"⚠️ 室外機の搬入経路によって追加料金が発生する場合があります。<br>":""}
      👨‍🔧 詳しくは店舗スタッフまでお気軽にご相談ください。
    </div>

    <button class="btn primary" onclick='step=0;for(const k in state)delete state[k];render()'>最初から診断する</button>
  </div>`;
}
render();
</script>
</body>
</html>
