<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>エアコン診断ツール</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f3f6fb;color:#111}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:40px 18px}
.card{background:white;border-radius:22px;padding:36px;margin-top:22px;box-shadow:0 6px 22px #00000012;text-align:center}
.big{font-size:56px;font-weight:900;color:#003b8f;line-height:1.25}
.sub{font-size:24px;font-weight:800;line-height:1.6}
.btn{display:block;width:100%;max-width:620px;margin:18px auto;padding:22px;border:3px solid #0046ad;background:white;color:#003b8f;border-radius:16px;font-size:28px;font-weight:900}
.btn.primary{background:#0046ad;color:white}
.btn.small{font-size:20px;padding:14px;max-width:280px}
.menuBtn{text-align:left;display:flex;align-items:center;gap:24px;padding:26px 34px}
.menuIcon{width:74px;height:74px;border-radius:50%;background:#0046ad;color:white;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0}
.menuText{flex:1}
.menuTitle{font-size:34px;font-weight:900}
.menuDesc{font-size:19px;margin-top:6px}
.arrow{font-size:42px}
.notice{background:#fff8dc;border-radius:16px;padding:22px;margin-top:26px;text-align:left;font-size:21px;line-height:1.9}
.progress{height:10px;background:#d8deea;border-radius:10px;margin-top:16px;overflow:hidden}
.bar{height:100%;background:#0068ff;width:0%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.option{border:3px solid #cfd8e8;border-radius:16px;padding:22px;font-size:26px;font-weight:900;background:white}
.resultPrice{font-size:68px;font-weight:900;color:#003b8f;margin:16px}
.detail{font-size:19px;text-align:left;display:inline-block;line-height:1.9}
.tapImage{position:relative;width:100%}
.tapImage img{width:100%;display:block;border-radius:14px;margin:15px 0;border:1px solid #ddd}
.hot{position:absolute;background:transparent;border:0}
.h1{left:2%;top:8%;width:23%;height:40%}
.h2{left:27%;top:8%;width:23%;height:40%}
.h3{left:52%;top:8%;width:23%;height:40%}
.h4{left:77%;top:8%;width:21%;height:40%}
.h5{left:2%;top:50%;width:31%;height:38%}
.h6{left:35%;top:50%;width:31%;height:38%}
.h7{left:68%;top:50%;width:30%;height:38%}
.p1{left:2%;top:15%;width:31%;height:70%}
.p2{left:34%;top:15%;width:31%;height:70%}
.p3{left:67%;top:15%;width:31%;height:70%}
.badge{display:inline-block;background:#eaf2ff;color:#003b8f;border-radius:999px;padding:8px 18px;font-size:20px;font-weight:900;margin:6px}
</style>
</head>
<body>
<div class="app">
  <div id="screen"></div>
</div>

<script>
const imgInstall="images/0AB48FD8-F66B-4575-B338-9394A00EAE6C.png";
const imgPiping="images/D79A56E4-7DC8-452D-B6C5-E52DCB0C0CDC.png";

const state={};
let step="home";
let history=[];

const base={small:20350,medium:24750,large:28050};
const removalFee=6600;
const recycleFee=4070;

const installNew={
  standard:{small:0,medium:0,large:0},
  wall:{small:16500,medium:18700,large:18700},
  koudan:{small:16500,medium:18700,large:18700},
  roof:{small:15400,medium:17600,large:17600},
  two:{small:19800,medium:20900,large:20900},
  second:{small:19800,medium:19800,large:19800},
  third:{small:36300,medium:36300,large:36300}
};

const installReplace={
  standard:{small:0,medium:0,large:0},
  wall:{small:8250,medium:10450,large:10450},
  koudan:{small:8250,medium:10450,large:10450},
  roof:{small:7700,medium:9900,large:9900},
  twoUpper:{small:2750,medium:3300,large:3300},
  twoLower:{small:7150,medium:8250,large:8250},
  second:{small:19800,medium:19800,large:19800},
  third:{small:36300,medium:36300,large:36300}
};

function yen(n){return "¥"+n.toLocaleString()+"〜"}

function label(v){
  return {
    small:"6〜12畳",medium:"14〜18畳",large:"20畳以上",
    new:"新規取付",replace:"買い替え",
    senior:"65歳以上",disabled:"障害者手帳あり",none:"該当しない",unknown:"わからない",
    house:"戸建て",apartment:"マンション/アパート",
    first:"1階",upper:"2階以上",
    yes:"はい",no:"いいえ",
    standard:"標準設置",wall:"壁掛け",koudan:"公団吊り",roof:"屋根置き",two:"二段置き",
    second:"室内機2階→室外機1階",third:"室内機3階→室外機1階",
    normal:"標準配管",hidden:"隠蔽配管",
    upperPos:"上段",lowerPos:"下段",
    indoor:"内階段",outdoor:"外階段"
  }[v] || v;
}

function next(to){history.push(step);step=to;render()}
function back(){if(history.length){step=history.pop();render()}}
function go(key,val,to){state[key]=val;next(to)}

function screen(title,html,percent){
  document.getElementById("screen").innerHTML=`
  <div class="card">
    ${history.length?`<button class="btn small" onclick="back()">← 戻る</button>`:""}
    <div class="progress"><div class="bar" style="width:${percent}%"></div></div>
    <h1>${title}</h1>
    ${html}
  </div>`;
}

function render(){
  if(step==="home"){
    document.getElementById("screen").innerHTML=`
    <div class="card">
      <div class="big">エアコン診断ツール</div>
      <p class="sub">やりたい診断を選んでください</p>

      <button class="btn primary menuBtn" onclick="next('type')">
        <span class="menuIcon">🔧</span>
        <span class="menuText">
          <span class="menuTitle">工事費診断</span>
          <span class="menuDesc">設置条件から工事費の概算がわかります</span>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="btn menuBtn" onclick="next('makerConcern')">
        <span class="menuIcon">🏆</span>
        <span class="menuText">
          <span class="menuTitle">後悔しないメーカー診断</span>
          <span class="menuDesc">あなたに合うエアコンメーカーをおすすめします</span>
        </span>
        <span class="arrow">›</span>
      </button>

      <div class="notice">
        ⚠️ 表示金額は概算です。<br>
        ⚠️ 設置状況により追加工事費が発生する場合があります。<br>
        👷 詳しくは店舗スタッフまでお気軽にご相談ください。
      </div>
    </div>`;
    return;
  }

  if(step==="type") screen("新規取付ですか？買い替えですか？",`
    <button class="btn" onclick="go('type','new','tokyo')">新規取付</button>
    <button class="btn" onclick="go('type','replace','tokyo')">買い替え</button>
  `,8);

  if(step==="tokyo") screen("お住まいは東京都ですか？",`
    <button class="btn" onclick="goTokyo('yes')">はい</button>
    <button class="btn" onclick="goTokyo('no')">いいえ</button>
  `,16);

  if(step==="zero") screen("あなたは以下のいずれかに該当しますか？",`
    <button class="btn" onclick="goZero('senior')">65歳以上</button>
    <button class="btn" onclick="goZero('disabled')">障害者手帳を持っている</button>
    <button class="btn" onclick="goZero('none')">該当しない</button>
    <button class="btn" onclick="goZero('unknown')">わからない</button>
  `,24);

  if(step==="oldAge") screen("現在お使いのエアコンは？",`
    <button class="btn" onclick="go('oldAge','15over','size')">15年以上使用している</button>
    <button class="btn" onclick="go('oldAge','under15','size')">15年未満</button>
    <button class="btn" onclick="go('oldAge','unknown','size')">わからない</button>
  `,32);

  if(step==="size") screen("購入したいエアコンは何畳用ですか？",`
    <button class="btn" onclick="go('size','small','building')">6畳</button>
    <button class="btn" onclick="go('size','small','building')">8畳</button>
    <button class="btn" onclick="go('size','small','building')">10畳</button>
    <button class="btn" onclick="go('size','small','building')">12畳</button>
    <button class="btn" onclick="go('size','medium','building')">14畳</button>
    <button class="btn" onclick="go('size','medium','building')">18畳</button>
    <button class="btn" onclick="go('size','large','building')">20畳以上</button>
  `,40);

  if(step==="building") screen("お住まいの種類を選んでください",`
    <div class="grid">
      <button class="option" onclick="go('building','house','install')">戸建て</button>
      <button class="option" onclick="go('building','apartment','floor')">マンション/アパート</button>
    </div>
  `,48);

  if(step==="floor") screen("お住まいの階数は？",`
    <button class="btn" onclick="go('floor','first','install')">1階</button>
    <button class="btn" onclick="go('floor','upper','elevator')">2階以上</button>
  `,56);

  if(step==="elevator") screen("エレベーターはありますか？",`
    <button class="btn" onclick="go('elevator','yes','install')">あり</button>
    <button class="btn" onclick="go('elevator','no','install')">なし</button>
  `,64);

  if(step==="install") screen("設置方法を選んでください",`
    <div class="tapImage">
      <img src="${imgInstall}" onerror="this.style.display='none'">
      <button class="hot h1" onclick="goInstall('standard')"></button>
      <button class="hot h2" onclick="goInstall('wall')"></button>
      <button class="hot h3" onclick="goInstall('koudan')"></button>
      <button class="hot h4" onclick="goInstall('roof')"></button>
      <button class="hot h5" onclick="goInstall('two')"></button>
      <button class="hot h6" onclick="goInstall('second')"></button>
      <button class="hot h7" onclick="goInstall('third')"></button>
    </div>
  `,72);

  if(step==="twoPos") screen("二段置きのどちらですか？",`
    <button class="btn" onclick="go('twoPos','upperPos','piping')">上段</button>
    <button class="btn" onclick="go('twoPos','lowerPos','piping')">下段</button>
  `,80);

  if(step==="piping") screen("配管の種類を選んでください",`
    <div class="tapImage">
      <img src="${imgPiping}" onerror="this.style.display='none'">
      <button class="hot p1" onclick="goPiping('normal')"></button>
      <button class="hot p2" onclick="goPiping('hidden')"></button>
      <button class="hot p3" onclick="goPiping('unknown')"></button>
    </div>
  `,88);

  if(step==="stairs") screen("室外機を階段で運ぶ必要がありますか？",`
    <button class="btn" onclick="go('stairs','none','result')">なし</button>
    <button class="btn" onclick="go('stairs','indoor','result')">内階段</button>
    <button class="btn" onclick="go('stairs','outdoor','result')">外階段</button>
    <button class="btn" onclick="go('stairs','unknown','result')">わからない</button>
  `,96);

  if(step==="result") result();

  if(step==="makerConcern") screen("エアコン選びで一番後悔したくないことは？",`
    <button class="btn" onclick="go('concern','electric','makerRoom')">💰 電気代</button>
    <button class="btn" onclick="go('concern','clean','makerCleaning')">🧹 掃除・清潔性</button>
    <button class="btn" onclick="go('concern','smell','makerRoom')">🤧 花粉・ニオイ</button>
    <button class="btn" onclick="go('concern','wind','makerRoom')">🥶 風あたり</button>
    <button class="btn" onclick="go('concern','power','makerRoom')">🔥 パワー不足</button>
    <button class="btn" onclick="go('concern','support','makerRoom')">☎️ 修理・サポート</button>
    <button class="btn" onclick="go('concern','kidsPets','makerRoom')">👶 子供・ペットの快適性</button>
    <button class="btn" onclick="go('concern','kitchen','makerRoom')">🍳 キッチン近くの汚れ</button>
    <button class="btn" onclick="go('concern','outdoor','makerRoom')">🏠 室外機の置き場所</button>
  `,25);

  if(step==="makerCleaning") screen("お掃除はどちらが近いですか？",`
    <button class="btn" onclick="go('cleaning','auto','makerRoom')">自分ではあまり掃除したくない</button>
    <button class="btn" onclick="go('cleaning','self','makerRoom')">自分でしっかり掃除したい</button>
    <button class="btn" onclick="go('cleaning','smell','makerRoom')">ニオイ・空気もきれいにしたい</button>
  `,50);

  if(step==="makerRoom") screen("使うお部屋はどんな場所ですか？",`
    <button class="btn" onclick="go('room','ldk','makerResult')">広いリビング・LDK</button>
    <button class="btn" onclick="go('room','kitchen','makerResult')">キッチンが近い部屋</button>
    <button class="btn" onclick="go('room','bedroom','makerResult')">寝室・子供部屋</button>
    <button class="btn" onclick="go('room','pets','makerResult')">ペットや小さい子供がいる部屋</button>
    <button class="btn" onclick="go('room','senior','makerResult')">高齢の方が使う部屋</button>
    <button class="btn" onclick="go('room','smallOutdoor','makerResult')">室外機の置き場所が狭い</button>
  `,75);

  if(step==="makerResult") makerResult();
}

function goTokyo(v){
  state.tokyo=v;
  if(v==="no"){next("size");return}
  next("zero");
}

function goZero(v){
  state.zero=v;
  if(state.type==="replace" && !(v==="senior" || v==="disabled")){next("oldAge");return}
  next("size");
}

function goInstall(v){
  state.install=v;
  if(v==="two") next("twoPos");
  else next("piping");
}

function goPiping(v){
  state.piping=v;
  if(state.building==="apartment" && state.floor==="upper" && state.elevator==="no"){
    next("stairs");
    return;
  }
  next("result");
}

function stairsFee(){
  const s=state.size;
  if(state.building==="house" && (state.install==="second" || state.install==="third")){
    return s==="small" ? 2200 : 3300;
  }
  if(state.stairs==="indoor") return s==="small" ? 2200 : 3300;
  if(state.stairs==="outdoor") return 2200;
  return 0;
}

function calc(){
  const s=state.size;
  let total=base[s]||0;

  if(state.type==="new"){
    total+=(installNew[state.install]?.[s]||0);
  }else{
    if(state.install==="two"){
      const key=state.twoPos==="lowerPos" ? "twoLower" : "twoUpper";
      total+=(installReplace[key]?.[s]||0);
    }else{
      total+=(installReplace[state.install]?.[s]||0);
    }
    total+=removalFee;
    total+=recycleFee;
  }

  if(state.piping==="hidden") total+=8800;
  total+=stairsFee();
  return total;
}

function zeroText(){
  if(state.tokyo!=="yes") return "";
  if(state.zero==="senior" || state.zero==="disabled"){
    return "🟢 対象機種が一律80,000円引きになる場合があります。詳しくはスタッフまでご相談ください。";
  }
  if(state.type==="replace"){
    return "🟢 東京都の補助制度の対象となる可能性があります。";
  }
  return "⚪ 東京都の補助制度についてはスタッフへご相談ください。";
}

function result(){
  const total=calc();
  const details=[
    label(state.type),
    state.tokyo ? "東京都："+label(state.tokyo) : "",
    state.zero ? label(state.zero) : "",
    label(state.size),
    label(state.building),
    state.building==="apartment" ? "階数："+label(state.floor) : "",
    state.elevator ? "エレベーター："+label(state.elevator) : "",
    state.stairs ? "階段搬入："+label(state.stairs) : "",
    "設置方法："+label(state.install),
    state.install==="two"&&state.twoPos ? "二段置き："+label(state.twoPos) : "",
    "配管："+label(state.piping),
    state.oldAge ? "使用年数："+(state.oldAge==="15over"?"15年以上":state.oldAge==="under15"?"15年未満":"わからない") : ""
  ].filter(Boolean);

  document.getElementById("screen").innerHTML=`
  <div class="card">
    <h1>診断結果</h1>
    <div class="sub">概算工事費総額</div>
    <div class="resultPrice">${yen(total)}</div>
    ${state.type==="replace" ? `<p class="sub">取り外し料・家電リサイクル料を含みます</p>` : ""}
    <p class="sub">この画面をスタッフへお見せください</p>

    <div class="detail">
      <strong>診断内容</strong><br>
      ${details.map(x=>"・"+x).join("<br>")}
      ${state.type==="replace" ? `<br>・取り外し料：${yen(removalFee)}<br>・家電リサイクル料：${yen(recycleFee)}` : ""}
      <br><br>${zeroText()}
    </div>

    <div class="notice">
      ⚠️ 表示金額は概算工事費です。<br>
      ${state.type==="replace" ? "⚠️ 表示金額には取り外し料・家電リサイクル料を含みます。<br>" : ""}
      ⚠️ 設置状況により追加工事費が発生する場合があります。<br>
      ${state.piping==="unknown" ? "⚠️ 配管種類が不明のため、追加料金が発生する場合があります。<br>" : ""}
      ${state.stairs==="unknown" ? "⚠️ 室外機の搬入経路によって追加料金が発生する場合があります。<br>" : ""}
      👷 詳しくは店舗スタッフまでお気軽にご相談ください。
    </div>

    <button class="btn primary" onclick="next('makerConcern')">メーカー診断へ進む</button>
    <button class="btn" onclick="resetAll()">ホームへ戻る</button>
  </div>`;
}

function makerData(){
  let maker="ダイキン";
  let icon="🌬️";
  let title="広いお部屋やパワー重視ならこれ";
  let badges=["快適性","パワー","修理安心"];
  let points=[
    "設定温度になったあとも弱火のように運転して温度を保ちやすい",
    "冷えすぎ・暑くなりすぎを防ぎ、不快に感じづらい",
    "ストリーマで菌やニオイ対策にも強い",
    "空調専門メーカーで365日メーカー窓口があり安心"
  ];

  if(state.concern==="kitchen" || state.room==="kitchen" || state.cleaning==="auto"){
    maker="日立";
    icon="🧊";
    title="キッチン近くのお部屋・清潔性重視ならこれ";
    badges=["清潔性","凍結洗浄","掃除ラク"];
    points=[
      "凍結洗浄で熱交換器や奥の汚れを洗い流しやすい",
      "清潔性が高く、キッチン近くの油汚れが気になるお部屋におすすめ",
      "自分であまり掃除したくない方に向いている",
      "WNシリーズはより静かさも重視しやすい"
    ];
  }

  if(state.cleaning==="self" || state.concern==="outdoor" || state.room==="smallOutdoor" || state.concern==="electric"){
    maker="三菱電機";
    icon="👁️";
    title="センサー・自分でお手入れ・置き場所重視ならこれ";
    badges=["センサー","節電","室外機小さめ"];
    points=[
      "センサーが優秀で、暑がっている人・寒がっている人を見分けやすい",
      "人に合わせた運転で節電にもつながりやすい",
      "汚れが付きにくいコーティングでお手入れしやすい",
      "熱交換器の近くまで外して自分でしっかり掃除しやすい",
      "室外機が小さめで置き場所が不安な方にもおすすめ"
    ];
  }

  if(state.concern==="wind" || state.room==="senior" || state.room==="bedroom" || state.room==="pets"){
    maker="東芝";
    icon="🍃";
    title="風あたりが苦手・子供やペットがいるならこれ";
    badges=["無風感","子供","ペット"];
    points=[
      "無風感冷房で直接風が当たりにくい",
      "高齢の方・女性・小さいお子様にもおすすめ",
      "二段ベッドなどで片方だけ寒い、を減らしやすい",
      "停電後に自動でリスタートしてくれるので安心"
    ];
  }

  if(state.concern==="smell" || state.cleaning==="smell"){
    maker="Panasonic";
    icon="✨";
    title="ニオイ・空気ケア・自動排出ならこれ";
    badges=["ナノイー","ニオイ","自動排出"];
    points=[
      "ナノイーXでニオイ対策に強い",
      "水で包むイオンなので長持ちしやすい",
      "ソファー・絨毯・カーテンなどのニオイにもおすすめ",
      "自動排出があり、自分でお手入れしたい方にも向いている"
    ];
  }

  if(state.concern==="power" || state.concern==="support" || state.room==="ldk"){
    maker="ダイキン";
    icon="🌬️";
    title="広いお部屋やパワーが必要ならこれ";
    badges=["パワー","快適性","365日窓口"];
    points=[
      "設定温度到達後も弱運転で温度を保ちやすい",
      "広いリビングやLDKでも快適に使いやすい",
      "ストリーマで菌から対策しやすい",
      "空調専門メーカーで365日メーカー窓口があり安心"
    ];
  }

  return {maker,icon,title,badges,points};
}

function makerResult(){
  const r=makerData();

  document.getElementById("screen").innerHTML=`
  <div class="card">
    <h1>メーカー診断結果</h1>
    <div class="sub">あなたにおすすめ</div>
    <div class="resultPrice">${r.icon} ${r.maker}</div>
    <p class="sub">${r.title}</p>

    <div>
      ${r.badges.map(b=>`<span class="badge">${b}</span>`).join("")}
    </div>

    <div class="notice">
      <strong>おすすめポイント</strong><br>
      ${r.points.map(p=>"✅ "+p).join("<br>")}
    </div>

    <div class="notice">
      👷 最終的にはお部屋の広さ・設置場所・在庫機種に合わせてスタッフがご案内します。
    </div>

    <button class="btn" onclick="back()">← 戻る</button>
    <button class="btn primary" onclick="resetAll()">ホームへ戻る</button>
  </div>`;
}

function resetAll(){
  for(const k in state) delete state[k];
  history=[];
  step="home";
  render();
}

render();
</script>
</body>
</html>
